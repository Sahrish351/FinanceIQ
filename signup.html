<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign Up — FinanceIQ</title>
<link rel="stylesheet" href="style.css"/>
<style>
body {
  display: grid; place-items: center; min-height: 100vh; padding: 20px;
  background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(15,157,106,0.12) 0%, transparent 70%), var(--bg);
}

.auth-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 40px;
  width: 100%; max-width: 460px;
  animation: fadeUp 0.5s ease both;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

.auth-logo { font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--green); text-align: center; margin-bottom: 6px; }
.auth-logo span { color: var(--gold); }
.auth-tagline { text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 32px; }
.auth-title { font-family: var(--display); font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.auth-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

.name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.input-wrap { position: relative; }
.input-wrap input { padding-left: 40px; }
.input-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
.show-pw { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--muted); font-size: 14px; user-select: none; transition: color 0.2s; }
.show-pw:hover { color: var(--text); }

.strength-bar { height: 4px; border-radius: 50px; background: var(--bg3); margin-top: 8px; overflow: hidden; }
.strength-fill { height: 100%; border-radius: 50px; width: 0%; transition: width 0.4s ease, background 0.4s ease; }
.strength-label { font-size: 12px; margin-top: 5px; color: var(--muted); }

.terms-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 22px; }
.terms-row input[type="checkbox"] { accent-color: var(--green); width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; cursor: pointer; }
.terms-row label { font-size: 13px; color: var(--muted); line-height: 1.5; cursor: pointer; }
.terms-row label a { color: var(--green); text-decoration: none; }
.terms-row label a:hover { text-decoration: underline; }

.btn-full { width: 100%; padding: 13px; justify-content: center; font-size: 15px; border-radius: 10px; }

.divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--muted); font-size: 13px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); }
.auth-footer a { color: var(--green); text-decoration: none; font-weight: 600; }
.auth-footer a:hover { text-decoration: underline; }

.error-msg {
  background: rgba(224,112,112,0.1); border: 1px solid rgba(224,112,112,0.3);
  color: var(--danger); border-radius: 8px; padding: 10px 14px;
  font-size: 13px; margin-bottom: 16px; display: none;
}

.perks { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
.perk { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.perk-icon { color: var(--green); font-size: 15px; flex-shrink: 0; }

.field-hint { font-size: 12px; color: var(--muted); margin-top: 5px; }

@media (max-width: 480px) {
  .auth-card { padding: 28px 20px; }
  .name-row { grid-template-columns: 1fr; gap: 0; }
}
</style>
</head>
<body>

<div class="auth-card">

  <div class="auth-logo">Finance<span>IQ</span></div>
  <div class="auth-tagline">Your smart money companion</div>

 
  <div class="error-msg" id="errorMsg"></div>

  <!-- NAME ROW -->
  <div class="name-row">
    <div class="form-group">
      <label>First Name</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" class="form-control" id="firstName" placeholder="Sahrish"/>
      </div>
    </div>
    <div class="form-group">
      <label>Last Name</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" class="form-control" id="lastName" placeholder="Khan"/>
      </div>
    </div>
  </div>

  <!-- EMAIL -->
  <div class="form-group">
    <label>Email Address</label>
    <div class="input-wrap">
      <span class="input-icon">📧</span>
      <input type="email" class="form-control" id="email" placeholder="you@example.com"/>
    </div>
  </div>


  <!-- PASSWORD -->
  <div class="form-group">
    <label>Password</label>
    <div class="input-wrap">
      <span class="input-icon">🔒</span>
      <input type="password" class="form-control" id="password" placeholder="Create a strong password" oninput="checkStrength()"/>
      <span class="show-pw" onclick="togglePw('password', this)">👁</span>
    </div>
    
  </div>

  <!-- CONFIRM PASSWORD -->
  <div class="form-group">
    <label>Confirm Password</label>
    <div class="input-wrap">
      <span class="input-icon">🔒</span>
      <input type="password" class="form-control" id="confirmPw" placeholder="Repeat your password"/>
      <span class="show-pw" onclick="togglePw('confirmPw', this)">👁</span>
    </div>
    <div class="field-hint" id="matchHint"></div>
  </div>

  <!-- TERMS -->
  <div class="terms-row">
    <input type="checkbox" id="terms"/>
    <label for="terms">I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>. I understand my data is stored securely.</label>
  </div>

  <!-- SUBMIT -->
  <button class="btn btn-primary btn-full" id="signupBtn" onclick="doSignup()">Create Free Account →</button>

  <div class="divider">or</div>

  <a href="login.html" class="btn btn-ghost btn-full" style="display:flex;justify-content:center;font-size:14px">Already have an account? Log In</a>

  <div class="auth-footer" style="margin-top:20px">
    🔒 Your data is encrypted and never shared with third parties.
  </div>

</div>

<div id="toast">✓ Done</div>

<script>
function togglePw(fieldId, icon) {
  const inp = document.getElementById(fieldId);
  if (inp.type === 'password') { inp.type = 'text'; icon.textContent = '🙈'; }
  else { inp.type = 'password'; icon.textContent = '👁'; }
}

function checkStrength() {
  const pw = document.getElementById('password').value;
  const fill = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');

  let score = 0;
  if (pw.length >= 6) score++;
  if (pw.length >= 10) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^a-zA-Z0-9]/.test(pw)) score++;

  const levels = [
    { pct: '0%',   color: 'transparent', text: 'Enter a password' },
    { pct: '20%',  color: '#e07070',     text: 'Very weak' },
    { pct: '40%',  color: '#f5a623',     text: 'Weak' },
    { pct: '60%',  color: '#c9a84c',     text: 'Fair' },
    { pct: '80%',  color: '#0f9d6a',     text: 'Strong ✓' },
    { pct: '100%', color: '#0f9d6a',     text: 'Very strong ✓✓' },
  ];

  const lvl = levels[pw.length === 0 ? 0 : score];
  fill.style.width = lvl.pct;
  fill.style.background = lvl.color;
  label.textContent = lvl.text;
  label.style.color = pw.length === 0 ? 'var(--muted)' : lvl.color;

  checkMatch();
}

function checkMatch() {
  const pw = document.getElementById('password').value;
  const cpw = document.getElementById('confirmPw').value;
  const hint = document.getElementById('matchHint');
  if (!cpw) { hint.textContent = ''; return; }
  if (pw === cpw) { hint.textContent = '✓ Passwords match'; hint.style.color = 'var(--green)'; }
  else { hint.textContent = '✗ Passwords do not match'; hint.style.color = 'var(--danger)'; }
}

document.getElementById('confirmPw').addEventListener('input', checkMatch);

function doSignup() {
  const firstName = document.getElementById('firstName').value.trim();
  const lastName  = document.getElementById('lastName').value.trim();
  const email     = document.getElementById('email').value.trim();
  const pw        = document.getElementById('password').value;
  const cpw       = document.getElementById('confirmPw').value;
  const terms     = document.getElementById('terms').checked;
  const err       = document.getElementById('errorMsg');

  err.style.display = 'none';

  if (!firstName || !lastName) { showError('Please enter your first and last name.'); return; }
  if (!email || !email.includes('@')) { showError('Please enter a valid email address.'); return; }
  if (pw.length < 6) { showError('Password must be at least 6 characters long.'); return; }
  if (pw !== cpw) { showError('Passwords do not match. Please try again.'); return; }
  if (!terms) { showError('Please accept the Terms of Service to continue.'); return; }

  const btn = document.getElementById('signupBtn');
  btn.textContent = 'Creating your account...';
  btn.disabled = true;
  btn.style.opacity = '0.8';

  setTimeout(() => {
    window.location.href = 'dashboard.html';
  }, 1200);
}

function showError(msg) {
  const err = document.getElementById('errorMsg');
  err.textContent = msg;
  err.style.display = 'block';
  err.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doSignup(); });
</script>
</body>
</html>
