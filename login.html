<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log In — FinanceIQ</title>
<link rel="stylesheet" href="style.css"/>
<style>
body { display:grid; place-items:center; min-height:100vh; padding:20px;
  background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(15,157,106,0.12) 0%, transparent 70%), var(--bg); }
.auth-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:40px; width:100%; max-width:420px; }
.auth-logo { font-family:var(--display); font-size:26px; font-weight:700; color:var(--green); text-align:center; margin-bottom:6px; }
.auth-logo span { color:var(--gold); }
.auth-tagline { text-align:center; color:var(--muted); font-size:15px; margin-bottom:32px; }
.auth-title { font-family:var(--display); font-size:24px; font-weight:700; margin-bottom:4px; }
.auth-sub { font-size:14px; color:var(--muted); margin-bottom:28px; }
.divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--muted); font-size:13px; }
.divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
.btn-full { width:100%; padding:13px; justify-content:center; font-size:15px; border-radius:10px; }
.forgot { font-size:13px; color:var(--green); text-decoration:none; display:block; text-align:right; margin-top:-8px; margin-bottom:20px; }
.forgot:hover { text-decoration:underline; }
.auth-footer { text-align:center; margin-top:24px; font-size:14px; color:var(--muted); }
.auth-footer a { color:var(--green); text-decoration:none; font-weight:600; }
.input-wrap { position:relative; }
.input-wrap input { padding-left:40px; }
.input-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:16px; }
.show-pw { position:absolute; right:13px; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--muted); font-size:14px; user-select:none; }
.error-msg { background:rgba(224,112,112,0.1); border:1px solid rgba(224,112,112,0.3); color:var(--danger); border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:16px; display:none; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">Finance<span>IQ</span></div>
  <div class="auth-tagline">Smart money management</div>

  <div class="auth-title">Welcome back 👋</div>
  <div class="auth-sub">Log in to your account to continue</div>

  <div class="error-msg" id="errorMsg">Invalid email or password. Please try again.</div>

  <div class="form-group">
    <label>Email Address</label>
    <div class="input-wrap">
      <span class="input-icon">📧</span>
      <input type="email" class="form-control" id="email" placeholder="you@example.com"/>
    </div>
  </div>

  <div class="form-group">
    <label>Password</label>
    <div class="input-wrap">
      <span class="input-icon">🔒</span>
      <input type="password" class="form-control" id="password" placeholder="Enter your password"/>
      <span class="show-pw" onclick="togglePw()">👁</span>
    </div>
  </div>

  <a href="#" class="forgot">Forgot password?</a>

  <button class="btn btn-primary btn-full" onclick="doLogin()">Log In to Dashboard</button>

  <div class="divider">or continue with</div>

  <button class="btn btn-ghost btn-full" style="margin-bottom:10px" onclick="demoLogin()">🚀 Try Demo Account</button>

  <div class="auth-footer">
    Don't have an account? <a href="signup.html">Sign up free</a>
  </div>
</div>

<script>
function togglePw() {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function doLogin() {
  const email = document.getElementById('email').value;
  const pw = document.getElementById('password').value;
  const err = document.getElementById('errorMsg');
  if(!email || !pw) { err.textContent='Please enter email and password.'; err.style.display='block'; return; }
  if(pw.length < 6) { err.textContent='Password must be at least 6 characters.'; err.style.display='block'; return; }
  err.style.display='none';
  // Simulate login
  const btn = document.querySelector('.btn-primary');
  btn.textContent='Logging in...';
  setTimeout(() => { window.location.href='dashboard.html'; }, 900);
}

function demoLogin() {
  document.getElementById('email').value = 'demo@financeiq.com';
  document.getElementById('password').value = 'demo123';
  setTimeout(() => { window.location.href='dashboard.html'; }, 600);
}

document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
