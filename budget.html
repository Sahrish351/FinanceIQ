<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Budget — FinanceIQ</title>
<link rel="stylesheet" href="style.css"/>
<style>
.budget-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; margin-bottom:32px; }
.bud-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; transition:all 0.25s; }
.bud-card:hover { border-color:var(--border2); transform:translateY(-2px); }
.bud-card-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
.bud-icon { font-size:26px; }
.bud-actions { display:flex; gap:6px; }
.bud-cat { font-size:18px; font-weight:600; margin-bottom:4px; }
.bud-meta { font-size:13px; color:var(--muted); }
.bud-amounts { display:flex; justify-content:space-between; margin:16px 0 8px; }
.bud-spent-lbl { font-size:13px; color:var(--muted); }
.bud-spent-val { font-family:var(--display); font-size:22px; font-weight:700; }
.bud-total-lbl { font-size:12px; color:var(--muted); text-align:right; }
.bud-total-val { font-size:16px; font-weight:600; text-align:right; }
.bud-footer { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
.bud-remaining { font-size:13px; }
.bud-pct-lbl { font-size:14px; font-weight:700; }
.over-indicator { background:rgba(224,112,112,0.1); border:1px solid rgba(224,112,112,0.3); border-radius:var(--radius-sm); padding:10px 14px; display:flex; align-items:center; gap:10px; margin-top:12px; font-size:13px; color:var(--danger); }
.month-selector { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
.month-btn { background:var(--surface); border:1px solid var(--border); color:var(--muted); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; font-family:var(--body); transition:all 0.2s; }
.month-btn:hover { border-color:var(--border2); color:var(--text); }
.month-display { font-size:16px; font-weight:600; color:var(--text); min-width:140px; text-align:center; }
.overall-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px; margin-bottom:28px; }
.overall-row { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
.ov-item { text-align:center; }
.ov-val { font-family:var(--display); font-size:26px; font-weight:700; }
.ov-lbl { font-size:12px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:0.7px; }
.category-tip { background:rgba(201,168,76,0.08); border:1px solid rgba(201,168,76,0.2); border-radius:var(--radius-sm); padding:14px 18px; margin-bottom:28px; display:flex; gap:12px; align-items:flex-start; }
.tip-icon { font-size:20px; flex-shrink:0; margin-top:1px; }
.tip-text { font-size:14px; color:var(--muted); line-height:1.6; }
.tip-text strong { color:var(--gold); }
@media(max-width:600px){.overall-row{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="nav-logo">Finance<span>IQ</span></a>
  <ul class="nav-links">
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="transaction.html">Transactions</a></li>
    <li><a href="budget.html" class="active">Budget</a></li>
    <li><a href="report.html">Reports</a></li>
    <li><a href="goals.html">Goals</a></li>
  </ul>
  <div class="nav-right"><button class="theme-toggle" aria-label="Toggle theme"><div class="toggle-knob"></div></button><div class="nav-avatar">AK</div></div>
</nav>

<div class="page-wrap">
<div class="container">

  <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px">
    <div>
      <h1>Budget Manager</h1>
      <p>Set limits, track spending, stay on target</p>
    </div>
    <button class="btn btn-primary" onclick="openAddModal()">+ New Budget</button>
  </div>

  <!-- MONTH SELECTOR -->
  <div class="month-selector">
    <button class="month-btn" onclick="changeMonth(-1)">← Prev</button>
    <div class="month-display" id="monthDisplay">June 2025</div>
    <button class="month-btn" onclick="changeMonth(1)">Next →</button>
  </div>

  <!-- OVERALL SUMMARY -->
  <div class="overall-card card-accent">
    <div style="font-size:13px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:18px">Monthly Overview</div>
    <div class="overall-row" id="overallRow"></div>
    <div style="margin-top:20px">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px">
        <span>Overall Budget Usage</span>
        <span id="overallPctLbl">0%</span>
      </div>
      <div class="progress-wrap" style="height:12px">
        <div class="progress-fill" id="overallFill" style="width:0%;background:var(--green)"></div>
      </div>
    </div>
  </div>

  <!-- TIP -->
  <div class="category-tip" id="tipBox" style="display:none">
    <div class="tip-icon">💡</div>
    <div class="tip-text" id="tipText"></div>
  </div>

  <!-- BUDGET CARDS -->
  <div class="budget-grid" id="budgetGrid"></div>

  <div id="emptyBudget" style="display:none;text-align:center;padding:60px 20px;color:var(--muted)">
    <div style="font-size:48px;margin-bottom:14px">🎯</div>
    <div style="font-size:16px">No budgets set for this month</div>
    <button class="btn btn-primary" style="margin-top:18px" onclick="openAddModal()">Add Your First Budget</button>
  </div>

</div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h3>New Budget</h3>
      <button class="modal-close" onclick="closeAddModal()">×</button>
    </div>
    <div class="form-group">
      <label>Category</label>
      <select class="form-control" id="bCat">
        <option>🏠 Rent</option><option>🛒 Groceries</option><option>⚡ Utilities</option>
        <option>🚗 Transport</option><option>🎬 Entertainment</option><option>🍔 Food</option>
        <option>🏥 Healthcare</option><option>🛍️ Shopping</option><option>📚 Education</option>
        <option>✈️ Travel</option><option>💊 Medicines</option><option>📱 Phone/Internet</option>
        <option>🎁 Gifts</option><option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Budget Amount ($)</label>
      <input type="number" class="form-control" id="bAmount" placeholder="e.g. 500" min="1"/>
    </div>
    <div class="form-group">
      <label>Spent So Far ($) <span style="color:var(--muted);font-weight:400">(optional)</span></label>
      <input type="number" class="form-control" id="bSpent" placeholder="0" min="0"/>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addBudget()">Save Budget</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit Budget</h3>
      <button class="modal-close" onclick="closeEditModal()">×</button>
    </div>
    <div class="form-group">
      <label>Category</label>
      <input type="text" class="form-control" id="eCat" readonly/>
    </div>
    <div class="form-group">
      <label>Budget Amount ($)</label>
      <input type="number" class="form-control" id="eAmount" min="1"/>
    </div>
    <div class="form-group">
      <label>Spent ($)</label>
      <input type="number" class="form-control" id="eSpent" min="0"/>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Update Budget</button>
    </div>
  </div>
</div>

<div id="toast">✓ Done</div>

<script>
let budgets = [
  {id:1, cat:'🏠 Rent', amount:1200, spent:1200},
  {id:2, cat:'🛒 Groceries', amount:500, spent:380},
  {id:3, cat:'⚡ Utilities', amount:300, spent:150},
  {id:4, cat:'🎬 Entertainment', amount:200, spent:180},
  {id:5, cat:'🚗 Transport', amount:200, spent:70},
  {id:6, cat:'🍔 Food', amount:300, spent:115},
];
let nextId = 7;
let editingId = null;
const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let monthOffset = 0;

function getMonthLabel() {
  const d = new Date(2025,5 + monthOffset,1);
  return months[d.getMonth()] + ' ' + d.getFullYear();
}

function changeMonth(dir) { monthOffset += dir; document.getElementById('monthDisplay').textContent = getMonthLabel(); render(); }

function getColor(pct) {
  if(pct >= 100) return '#e07070';
  if(pct >= 75) return '#f5a623';
  return '#0f9d6a';
}

function render() {
  const grid = document.getElementById('budgetGrid');
  const empty = document.getElementById('emptyBudget');
  if(budgets.length === 0) { grid.innerHTML=''; empty.style.display='block'; updateOverall(); return; }
  empty.style.display='none';

  grid.innerHTML = budgets.map(b => {
    const pct = Math.round(b.spent / b.amount * 100);
    const color = getColor(pct);
    const rem = b.amount - b.spent;
    const over = b.spent > b.amount;
    return `<div class="bud-card">
      <div class="bud-card-top">
        <div>
          <div class="bud-cat">${b.cat}</div>
          <div class="bud-meta">${getMonthLabel()}</div>
        </div>
        <div class="bud-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEditModal(${b.id})">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="deleteBudget(${b.id})">🗑</button>
        </div>
      </div>
      <div class="bud-amounts">
        <div><div class="bud-spent-lbl">Spent</div><div class="bud-spent-val" style="color:${color}">$${b.spent.toFixed(0)}</div></div>
        <div><div class="bud-total-lbl">Budget</div><div class="bud-total-val">$${b.amount.toFixed(0)}</div></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-fill" style="width:${Math.min(pct,100)}%;background:${color}"></div>
      </div>
      <div class="bud-footer">
        <span class="bud-remaining" style="color:${over?'var(--danger)':'var(--muted)'}">${over?'⚠️ Over by $'+Math.abs(rem).toFixed(0):'$'+rem.toFixed(0)+' left'}</span>
        <span class="bud-pct-lbl" style="color:${color}">${pct}%</span>
      </div>
      ${over ? `<div class="over-indicator">⚠️ You've exceeded this budget by $${Math.abs(rem).toFixed(0)}</div>` : ''}
    </div>`;
  }).join('');

  updateOverall();
  updateTip();
}

function updateOverall() {
  const totalBudget = budgets.reduce((s,b)=>s+b.amount,0);
  const totalSpent = budgets.reduce((s,b)=>s+b.spent,0);
  const totalRem = totalBudget - totalSpent;
  const pct = totalBudget > 0 ? Math.round(totalSpent/totalBudget*100) : 0;
  const color = getColor(pct);

  document.getElementById('overallRow').innerHTML = `
    <div class="ov-item"><div class="ov-val" style="color:var(--text)">$${totalBudget.toLocaleString()}</div><div class="ov-lbl">Total Budget</div></div>
    <div class="ov-item"><div class="ov-val" style="color:${color}">$${totalSpent.toLocaleString()}</div><div class="ov-lbl">Total Spent</div></div>
    <div class="ov-item"><div class="ov-val" style="color:${totalRem>=0?'var(--green)':'var(--danger)'}">$${Math.abs(totalRem).toLocaleString()}</div><div class="ov-lbl">${totalRem>=0?'Remaining':'Over Budget'}</div></div>
    <div class="ov-item"><div class="ov-val" style="color:${color}">${pct}%</div><div class="ov-lbl">Used</div></div>
  `;

  const fill = document.getElementById('overallFill');
  fill.style.width = Math.min(pct,100)+'%';
  fill.style.background = color;
  document.getElementById('overallPctLbl').textContent = pct+'%';
}

function updateTip() {
  const overBudget = budgets.filter(b => b.spent > b.amount);
  const nearBudget = budgets.filter(b => b.spent/b.amount >= 0.85 && b.spent <= b.amount);
  const tip = document.getElementById('tipBox');
  const tipText = document.getElementById('tipText');
  if(overBudget.length > 0) {
    tip.style.display = 'flex';
    tipText.innerHTML = `<strong>⚠️ ${overBudget.length} budget(s) exceeded:</strong> ${overBudget.map(b=>b.cat).join(', ')}. Consider reviewing your spending in these categories.`;
  } else if(nearBudget.length > 0) {
    tip.style.display = 'flex';
    tipText.innerHTML = `<strong>💛 Almost at limit:</strong> ${nearBudget.map(b=>b.cat).join(', ')} are over 85% used. Stay mindful of your remaining budget.`;
  } else {
    tip.style.display = 'none';
  }
}

function openAddModal() { document.getElementById('addModal').classList.add('open'); }
function closeAddModal() { document.getElementById('addModal').classList.remove('open'); }

function addBudget() {
  const cat = document.getElementById('bCat').value;
  const amount = parseFloat(document.getElementById('bAmount').value);
  const spent = parseFloat(document.getElementById('bSpent').value) || 0;
  if(!amount || amount <= 0) { showToast('⚠️ Enter a valid amount'); return; }
  if(budgets.find(b=>b.cat===cat)) { showToast('⚠️ Category already exists'); return; }
  budgets.push({id:nextId++, cat, amount, spent});
  closeAddModal();
  document.getElementById('bAmount').value='';
  document.getElementById('bSpent').value='';
  render();
  showToast('✓ Budget added');
}

function openEditModal(id) {
  editingId = id;
  const b = budgets.find(x=>x.id===id);
  document.getElementById('eCat').value = b.cat;
  document.getElementById('eAmount').value = b.amount;
  document.getElementById('eSpent').value = b.spent;
  document.getElementById('editModal').classList.add('open');
}
function closeEditModal() { document.getElementById('editModal').classList.remove('open'); }

function saveEdit() {
  const b = budgets.find(x=>x.id===editingId);
  const amount = parseFloat(document.getElementById('eAmount').value);
  const spent = parseFloat(document.getElementById('eSpent').value);
  if(!amount||amount<=0) { showToast('⚠️ Invalid amount'); return; }
  b.amount = amount; b.spent = isNaN(spent) ? 0 : spent;
  closeEditModal(); render(); showToast('✏️ Updated');
}

function deleteBudget(id) {
  if(confirm('Delete this budget?')) {
    budgets = budgets.filter(b=>b.id!==id);
    render(); showToast('🗑 Deleted');
  }
}

function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200);
}

render();
</script>
</body>
</html>
